name: SATIE-1 release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: EN_SATIE1=1 sh build.sh --release "${GITHUB_REF_NAME#v}"
      packages: build/satie-1-*.fwsc
      test: |
        mkdir -p build/host
        cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off -std=c99 -DEN_HOST -DEN_SATIE1 -Ifirmware/src -Ifirmware/src/dsp satie/pad_continuity_test.c -lm -o build/host/pad_continuity_test
        build/host/pad_continuity_test
        python3 tests/install_test.py
